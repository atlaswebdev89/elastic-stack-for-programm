filebeat.autodiscover:
  providers:
    - type: docker
      hints.enabled: true
      hints.default_config.enabled: false
      templates:
        # 1. Высший приоритет: Logstash-контейнеры с меткой elastic.logs: "true"
        #    → специальный multiline по timestamp
        - condition:
            and:
              - equals:
                  docker.container.labels.elastic.logs: "true"
              - contains:
                  docker.container.name: "logstash-"
          config:
            - type: container
              paths:
                - /var/lib/docker/containers/${data.docker.container.id}/*.log
              fields:
                log_source: docker_containers
              fields_under_root: true
              parsers:
                - multiline:
                    pattern: '^\['
                    negate: true
                    match: after
        # 2. Все остальные контейнеры с меткой elastic.logs: "true"
        #    (не Logstash) → универсальный multiline
        - condition:
            equals:
              docker.container.labels.elastic.logs: "true"
          config:
            - type: container
              paths:
                - /var/lib/docker/containers/${data.docker.container.id}/*.log
              fields:
                log_source: docker_containers
              fields_under_root: true
              parsers:
                - multiline:
                    pattern: '^\s+(at|\.{3})|^\s*Caused by:|^[[:space:]]'
                    negate: false
                    match: after

processors:
  - add_docker_metadata:
      host: "unix:///var/run/docker.sock"

output.logstash:
  hosts:
    - elastic-logstash-node-1:5147
    - elastic-logstash-node-2:5147
  loadbalance: true